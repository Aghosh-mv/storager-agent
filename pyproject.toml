[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storager"
version = "0.2.0"
description = "Pure-algorithm disk space analyser — scans, inspects, classifies, diagnoses, explains in plain language, and always asks before deleting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Private Use License — see LICENSE" }
authors = [{ name = "Aghosh-mv" }]
keywords = ["disk", "cleanup", "storage", "analyzer", "cli"]

[project.scripts]
storager = "storager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["storager*"]
